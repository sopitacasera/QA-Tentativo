[pytest]
pythonpath = .
testpaths = tests
addopts =
    -v
    --tb=short
    --html=reports/report.html
    --self-contained-html
    --css=reports/qa-report.css
    --junitxml=reports/junit.xml
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(message)s
log_cli_date_format = %H:%M:%S
log_file = reports/execution.log
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)s %(name)s %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
markers =
    e2e: flujo funcional de punta a punta contra la tienda demo
